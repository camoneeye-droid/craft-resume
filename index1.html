<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CraftResume Studio | Free ATS-Friendly Resume Builder</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts for ATS & Design Selection -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Outfit:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            inter: ['Inter', 'sans-serif'],
            roboto: ['Roboto', 'sans-serif'],
            merriweather: ['Merriweather', 'serif'],
            poppins: ['Poppins', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    /* Standard A4 Paper Ratio & Shadow */
    .a4-sheet {
      width: 210mm;
      min-height: 297mm;
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.15), 0 0 1px 1px rgba(0,0,0,0.05);
      background-color: #ffffff;
      color: #1f2937;
      margin: 0 auto;
      box-sizing: border-box;
      position: relative;
    }

    /* Print Viewport Optimizations */
    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .no-print, header, aside, #toast, .action-bar, #mobile-preview-bar {
        display: none !important;
      }
      main {
        padding: 0 !important;
        margin: 0 !important;
        display: block !important;
        max-width: none !important;
      }
      #preview-pane {
        display: block !important;
        width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
      }
      .a4-sheet {
        box-shadow: none !important;
        margin: 0 !important;
        width: 100% !important;
        min-height: auto !important;
        border: none !important;
        border-radius: 0 !important;
        page-break-after: avoid;
      }
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f3f4f6;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Accordion transitions */
    .section-content {
      transition: max-height 0.25s ease-out, opacity 0.2s ease-out;
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 font-inter min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-900">

  <!-- TOP NAVIGATION HEADER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 px-4 sm:px-6 py-2.5 flex items-center justify-between no-print">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
        <i data-lucide="file-text" class="w-5 h-5"></i>
      </div>
      <div>
        <div class="flex items-center space-x-2">
          <h1 class="text-base sm:text-lg font-bold text-slate-900 tracking-tight">CraftResume</h1>
          <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">Studio</span>
        </div>
        <p class="text-[11px] text-slate-400 hidden sm:block">ATS-compliant, instant export & zero sign-in</p>
      </div>
    </div>

    <!-- Top Action Buttons -->
    <div class="flex items-center space-x-2 sm:space-x-2.5">
      <!-- Data Management -->
      <button onclick="loadSampleData()" class="px-2.5 sm:px-3 py-1.5 text-xs font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors flex items-center space-x-1.5">
        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-amber-500"></i>
        <span class="hidden sm:inline">Sample Data</span>
      </button>

      <button onclick="clearAllData()" class="px-2.5 sm:px-3 py-1.5 text-xs font-medium text-slate-600 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-colors flex items-center space-x-1.5">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        <span class="hidden md:inline">Reset</span>
      </button>

      <div class="h-4 w-[1px] bg-slate-200 mx-1"></div>

      <!-- JSON Backup & Restore -->
      <button onclick="exportJSON()" title="Backup to JSON" class="p-1.5 sm:px-2.5 sm:py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-100 rounded-lg transition-colors flex items-center space-x-1">
        <i data-lucide="download-cloud" class="w-4 h-4 text-slate-500"></i>
        <span class="hidden lg:inline">Backup</span>
      </button>

      <label title="Import JSON" class="p-1.5 sm:px-2.5 sm:py-1.5 text-xs font-medium text-slate-700 hover:bg-slate-100 rounded-lg transition-colors flex items-center space-x-1 cursor-pointer">
        <i data-lucide="upload-cloud" class="w-4 h-4 text-slate-500"></i>
        <span class="hidden lg:inline">Import</span>
        <input type="file" id="json-input" accept=".json" class="hidden" onchange="importJSON(event)">
      </label>

      <!-- PRINT / PDF BUTTON -->
      <button onclick="window.print()" class="px-3.5 sm:px-4 py-1.5 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:scale-95 rounded-lg shadow-sm hover:shadow transition-all flex items-center space-x-1.5">
        <i data-lucide="printer" class="w-4 h-4"></i>
        <span>Print / PDF</span>
      </button>
    </div>
  </header>

  <!-- MOBILE PREVIEW SWITCH TAB (Visible on small screens only) -->
  <div id="mobile-preview-bar" class="lg:hidden bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between no-print">
    <div class="inline-flex p-1 bg-slate-100 rounded-lg text-xs font-medium w-full">
      <button id="tab-editor" onclick="switchMobileView('editor')" class="flex-1 py-1.5 rounded-md text-slate-900 bg-white shadow-sm font-semibold flex items-center justify-center space-x-1.5">
        <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
        <span>Editor</span>
      </button>
      <button id="tab-preview" onclick="switchMobileView('preview')" class="flex-1 py-1.5 rounded-md text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-1.5">
        <i data-lucide="eye" class="w-3.5 h-3.5"></i>
        <span>Live Preview</span>
      </button>
    </div>
  </div>

  <!-- MAIN WORKSPACE -->
  <main class="flex-1 max-w-[1700px] w-full mx-auto p-3 sm:p-5 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
    
    <!-- LEFT PANEL: FORM EDITOR (5 COLS ON DESKTOP) -->
    <aside id="editor-pane" class="lg:col-span-5 space-y-4 no-print overflow-y-auto max-h-[calc(100vh-5.5rem)] pr-1">
      
      <!-- CONTROLS & THEME CUSTOMIZER -->
      <div class="bg-white rounded-xl p-4 border border-slate-200 shadow-sm space-y-4">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
            <i data-lucide="sliders" class="w-4 h-4 text-indigo-600"></i> Appearance & Layout
          </span>
          <span class="text-[11px] text-slate-400">ATS Optimized</span>
        </div>

        <div class="grid grid-cols-2 gap-3 text-xs">
          <!-- Template Selector -->
          <div>
            <label class="block font-medium text-slate-700 mb-1">Resume Template</label>
            <select id="cfg-template" onchange="updateConfig('template', this.value)" class="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 focus:bg-white focus:outline-none focus:border-indigo-500 text-xs font-medium">
              <option value="modern">Modern Minimal</option>
              <option value="executive">Executive Serif</option>
              <option value="compact">Tech Compact (2-Col)</option>
              <option value="creative">Creative Sidebar</option>
            </select>
          </div>

          <!-- Font Family -->
          <div>
            <label class="block font-medium text-slate-700 mb-1">Typography</label>
            <select id="cfg-font" onchange="updateConfig('font', this.value)" class="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 focus:bg-white focus:outline-none focus:border-indigo-500 text-xs font-medium">
              <option value="font-inter">Inter (Clean Sans)</option>
              <option value="font-roboto">Roboto (Geometric)</option>
              <option value="font-merriweather">Merriweather (Classic Serif)</option>
              <option value="font-poppins">Poppins (Modern Bold)</option>
              <option value="font-outfit">Outfit (Contemporary)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 text-xs items-center">
          <!-- Accent Color Palette -->
          <div>
            <label class="block font-medium text-slate-700 mb-1.5">Accent Color</label>
            <div class="flex items-center space-x-1.5" id="color-palette">
              <button onclick="updateConfig('accent', '#2563eb')" data-color="#2563eb" title="Royal Blue" class="palette-swatch w-5 h-5 rounded-full bg-blue-600 ring-2 ring-offset-2 ring-indigo-500"></button>
              <button onclick="updateConfig('accent', '#0f766e')" data-color="#0f766e" title="Deep Teal" class="palette-swatch w-5 h-5 rounded-full bg-teal-700"></button>
              <button onclick="updateConfig('accent', '#4f46e5')" data-color="#4f46e5" title="Indigo" class="palette-swatch w-5 h-5 rounded-full bg-indigo-600"></button>
              <button onclick="updateConfig('accent', '#991b1b')" data-color="#991b1b" title="Burgundy" class="palette-swatch w-5 h-5 rounded-full bg-red-800"></button>
              <button onclick="updateConfig('accent', '#1e293b')" data-color="#1e293b" title="Slate Noir" class="palette-swatch w-5 h-5 rounded-full bg-slate-800"></button>
              <button onclick="updateConfig('accent', '#166534')" data-color="#166534" title="Forest" class="palette-swatch w-5 h-5 rounded-full bg-emerald-800"></button>
            </div>
          </div>

          <!-- Spacing / Density -->
          <div>
            <label class="block font-medium text-slate-700 mb-1">Density & Spacing</label>
            <select id="cfg-density" onchange="updateConfig('density', this.value)" class="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 bg-slate-50 focus:bg-white focus:outline-none focus:border-indigo-500 text-xs font-medium">
              <option value="density-compact">Compact (Fit 1 page)</option>
              <option value="density-normal" selected>Balanced Normal</option>
              <option value="density-spacious">Spacious</option>
            </select>
          </div>
        </div>
      </div>

      <!-- SECTION 1: PERSONAL INFORMATION -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <button onclick="toggleSection('sec-personal')" class="w-full px-4 py-3 bg-slate-50/60 hover:bg-slate-50 flex items-center justify-between text-left transition-colors">
          <span class="text-xs font-bold text-slate-800 flex items-center gap-2">
            <i data-lucide="user" class="w-4 h-4 text-indigo-600"></i> Personal Contact & Summary
          </span>
          <i data-lucide="chevron-down" id="sec-personal-icon" class="w-4 h-4 text-slate-400 transition-transform duration-200"></i>
        </button>
        <div id="sec-personal" class="p-4 space-y-3 border-t border-slate-100">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-[11px] font-medium text-slate-600 mb-1">Full Name</label>
              <input type="text" id="f-fullName" oninput="updateField('personal.fullName', this.value)" placeholder="e.g. Alex Morgan" class="w-full px-2.5 py-1.5 text-xs rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-[11px] font-medium text-slate-600 mb-1">Target Job Title</label>
              <input type="text" id="f-jobTitle" oninput="updateField('personal.jobTitle', this.value)" placeholder="e.g. Senior Software Engineer" class="w-full px-2.5 py-1.5 text-xs rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label class="block text-[11px] font-medium text-slate-600 mb-1">Email</label>
              <input type="email" id="f-email" oninput="updateField('personal.email', this.value)" placeholder="alex@domain.com" class="w-full px-2.5 py-1.5 text-xs rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-[11px] font-medium text-slate-600 mb-1">Phone</label>
              <input type="text" id="f-phone" oninput="updateField('personal.phone', this.value)" placeholder="+1 (555) 019-2834" class="w-full px-2.5 py-1.5 text-xs rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-[11px] font-medium text-slate-600 mb-1">Location</label>
              <input type="text" id="f-location" oninput="updateField('personal.location', this.value)" placeholder="San Francisco, CA" class="w-full px-2.5 py-1.5 text-xs rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label class="block text-[11px] font-medium text-slate-600 mb-1">Portfolio / Website</label>
              <input type="text" id="f-website" oninput="updateField('personal.website', this.value)" placeholder="alexmorgan.dev" class="w-full px-2.5 py-1.5 text-xs rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-[11px] font-medium text-slate-600 mb-1">LinkedIn</label>
              <input type="text" id="f-linkedin" oninput="updateField('personal.linkedin', this.value)" placeholder="linkedin.com/in/alex" class="w-full px-2.5 py-1.5 text-xs rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-[11px] font-medium text-slate-600 mb-1">GitHub / Other</label>
              <input type="text" id="f-github" oninput="updateField('personal.github', this.value)" placeholder="github.com/alex" class="w-full px-2.5 py-1.5 text-xs rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-500">
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-medium text-slate-600 mb-1">Professional Summary</label>
            <textarea id="f-summary" rows="3" oninput="updateField('personal.summary', this.value)" placeholder="Results-driven professional with 6+ years of experience..." class="w-full px-2.5 py-2 text-xs rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-500 leading-relaxed"></textarea>
          </div>
        </div>
      </div>

      <!-- SECTION 2: WORK EXPERIENCE -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <button onclick="toggleSection('sec-experience')" class="w-full px-4 py-3 bg-slate-50/60 hover:bg-slate-50 flex items-center justify-between text-left transition-colors">
          <span class="text-xs font-bold text-slate-800 flex items-center gap-2">
            <i data-lucide="briefcase" class="w-4 h-4 text-indigo-600"></i> Work Experience
          </span>
          <i data-lucide="chevron-down" id="sec-experience-icon" class="w-4 h-4 text-slate-400 transition-transform duration-200"></i>
        </button>
        <div id="sec-experience" class="p-4 space-y-4 border-t border-slate-100">
          <div id="experience-items-list" class="space-y-4">
            <!-- Dynamically populated experience cards -->
          </div>
          <button onclick="addExperience()" class="w-full py-2 border border-dashed border-slate-300 hover:border-indigo-500 hover:text-indigo-600 text-slate-600 text-xs font-medium rounded-lg flex items-center justify-center space-x-1.5 transition-all">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>Add Work Experience</span>
          </button>
        </div>
      </div>

      <!-- SECTION 3: EDUCATION -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <button onclick="toggleSection('sec-education')" class="w-full px-4 py-3 bg-slate-50/60 hover:bg-slate-50 flex items-center justify-between text-left transition-colors">
          <span class="text-xs font-bold text-slate-800 flex items-center gap-2">
            <i data-lucide="graduation-cap" class="w-4 h-4 text-indigo-600"></i> Education
          </span>
          <i data-lucide="chevron-down" id="sec-education-icon" class="w-4 h-4 text-slate-400 transition-transform duration-200"></i>
        </button>
        <div id="sec-education" class="p-4 space-y-4 border-t border-slate-100">
          <div id="education-items-list" class="space-y-3">
            <!-- Dynamically populated education cards -->
          </div>
          <button onclick="addEducation()" class="w-full py-2 border border-dashed border-slate-300 hover:border-indigo-500 hover:text-indigo-600 text-slate-600 text-xs font-medium rounded-lg flex items-center justify-center space-x-1.5 transition-all">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>Add Education</span>
          </button>
        </div>
      </div>

      <!-- SECTION 4: SKILLS & TOOLS -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <button onclick="toggleSection('sec-skills')" class="w-full px-4 py-3 bg-slate-50/60 hover:bg-slate-50 flex items-center justify-between text-left transition-colors">
          <span class="text-xs font-bold text-slate-800 flex items-center gap-2">
            <i data-lucide="cpu" class="w-4 h-4 text-indigo-600"></i> Skills & Expertise
          </span>
          <i data-lucide="chevron-down" id="sec-skills-icon" class="w-4 h-4 text-slate-400 transition-transform duration-200"></i>
        </button>
        <div id="sec-skills" class="p-4 space-y-3 border-t border-slate-100">
          <div id="skills-groups-list" class="space-y-3">
            <!-- Dynamic skills groups -->
          </div>
          <button onclick="addSkillGroup()" class="w-full py-2 border border-dashed border-slate-300 hover:border-indigo-500 hover:text-indigo-600 text-slate-600 text-xs font-medium rounded-lg flex items-center justify-center space-x-1.5 transition-all">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>Add Skill Category</span>
          </button>
        </div>
      </div>

      <!-- SECTION 5: PROJECTS -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <button onclick="toggleSection('sec-projects')" class="w-full px-4 py-3 bg-slate-50/60 hover:bg-slate-50 flex items-center justify-between text-left transition-colors">
          <span class="text-xs font-bold text-slate-800 flex items-center gap-2">
            <i data-lucide="layers" class="w-4 h-4 text-indigo-600"></i> Projects
          </span>
          <i data-lucide="chevron-down" id="sec-projects-icon" class="w-4 h-4 text-slate-400 transition-transform duration-200"></i>
        </button>
        <div id="sec-projects" class="p-4 space-y-3 border-t border-slate-100">
          <div id="projects-items-list" class="space-y-3">
            <!-- Dynamically populated projects -->
          </div>
          <button onclick="addProject()" class="w-full py-2 border border-dashed border-slate-300 hover:border-indigo-500 hover:text-indigo-600 text-slate-600 text-xs font-medium rounded-lg flex items-center justify-center space-x-1.5 transition-all">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>Add Project</span>
          </button>
        </div>
      </div>

      <!-- SECTION 6: CERTIFICATIONS & AWARDS -->
      <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <button onclick="toggleSection('sec-certs')" class="w-full px-4 py-3 bg-slate-50/60 hover:bg-slate-50 flex items-center justify-between text-left transition-colors">
          <span class="text-xs font-bold text-slate-800 flex items-center gap-2">
            <i data-lucide="award" class="w-4 h-4 text-indigo-600"></i> Certifications & Awards
          </span>
          <i data-lucide="chevron-down" id="sec-certs-icon" class="w-4 h-4 text-slate-400 transition-transform duration-200"></i>
        </button>
        <div id="sec-certs" class="p-4 space-y-3 border-t border-slate-100">
          <div id="certs-items-list" class="space-y-2">
            <!-- Dynamic certification entries -->
          </div>
          <button onclick="addCertification()" class="w-full py-2 border border-dashed border-slate-300 hover:border-indigo-500 hover:text-indigo-600 text-slate-600 text-xs font-medium rounded-lg flex items-center justify-center space-x-1.5 transition-all">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span>Add Certification</span>
          </button>
        </div>
      </div>

    </aside>

    <!-- RIGHT PANEL: LIVE PREVIEW & PRINT CANVAS (7 COLS ON DESKTOP) -->
    <section id="preview-pane" class="lg:col-span-7 flex flex-col items-center justify-start overflow-x-auto pb-12">
      
      <!-- Top Canvas Status Helper -->
      <div class="w-full flex items-center justify-between text-xs text-slate-500 mb-3 px-1 no-print">
        <span class="flex items-center gap-1.5">
          <i data-lucide="shield-check" class="w-4 h-4 text-emerald-600"></i>
          <span>ATS Standard Safe Format</span>
        </span>
        <span class="text-[11px] text-slate-400">Standard A4 / Letter format</span>
      </div>

      <!-- RESUME PAPER CONTAINER (A4 BOUNDARIES) -->
      <div id="resume-sheet" class="a4-sheet p-8 sm:p-11 rounded-sm text-slate-800 font-inter transition-all duration-200">
        <!-- Rendered Resume HTML injects here -->
      </div>
    </section>

  </main>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs flex items-center space-x-2 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none no-print">
    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
    <span id="toast-message">Notification message</span>
  </div>

  <!-- APPLICATION LOGIC -->
  <script>
    // State Store
    const state = {
      config: {
        template: 'modern',
        font: 'font-inter',
        accent: '#2563eb',
        density: 'density-normal'
      },
      personal: {
        fullName: 'Alexander Reed',
        jobTitle: 'Senior Full Stack Engineer',
        email: 'alex.reed@example.com',
        phone: '+1 (555) 234-8971',
        location: 'San Francisco, CA',
        website: 'alexreed.dev',
        linkedin: 'linkedin.com/in/alexreed-dev',
        github: 'github.com/alexreed',
        summary: 'Accomplished Software Engineer with 6+ years of experience designing and scaling distributed systems, modern web architectures, and cloud-native microservices. Passionate about developer tooling, API reliability, and mentoring engineering teams.'
      },
      experience: [
        {
          id: 'exp-1',
          role: 'Lead Full Stack Engineer',
          company: 'Starlight Tech Inc.',
          location: 'San Francisco, CA',
          period: '2022 - Present',
          bullets: [
            'Architected event-driven microservices platform handling 15M+ daily requests using Node.js, Go, and Kafka.',
            'Spearheaded frontend migration to Next.js with Tailwind CSS, reducing average page load times by 42%.',
            'Mentored 6 junior/mid-level engineers, implemented strict automated CI/CD pipelines, and raised test coverage to 88%.'
          ]
        },
        {
          id: 'exp-2',
          role: 'Software Engineer',
          company: 'Vertex Cloud Solutions',
          location: 'Austin, TX',
          period: '2019 - 2022',
          bullets: [
            'Built real-time telemetry dashboards utilizing React, TypeScript, and GraphQL subscriptions.',
            'Automated infrastructure provisioning on AWS (Terraform, ECS, RDS), lowering monthly hosting costs by 28%.',
            'Collaborated with product designers to create an accessible, WCAG AA-compliant enterprise design system.'
          ]
        }
      ],
      education: [
        {
          id: 'edu-1',
          degree: 'B.S. in Computer Science',
          school: 'University of California, Berkeley',
          location: 'Berkeley, CA',
          year: '2015 - 2019',
          details: 'GPA 3.85 / 4.0 · Dean’s Honors List · President of ACM Student Chapter'
        }
      ],
      skills: [
        { id: 'sk-1', category: 'Languages', items: 'TypeScript, JavaScript, Python, Go, SQL, HTML5/CSS3' },
        { id: 'sk-2', category: 'Frameworks & Libraries', items: 'React, Next.js, Node.js, Express, Tailwind CSS, PostgreSQL' },
        { id: 'sk-3', category: 'Cloud & DevOps', items: 'AWS, Docker, Kubernetes, CI/CD Actions, Redis, Git' }
      ],
      projects: [
        {
          id: 'prj-1',
          title: 'PulseMetrics (Open-Source)',
          tech: 'TypeScript, Go, React, Tailwind',
          link: 'github.com/alexreed/pulsemetrics',
          description: 'A lightweight distributed server monitoring tool with real-time alerting and zero external dependencies.'
        },
        {
          id: 'prj-2',
          title: 'Automated Resume ATS Scanner',
          tech: 'Python, FastAPI, SpaCy, Next.js',
          link: 'github.com/alexreed/resume-scanner',
          description: 'Natural language keyword density analyzer comparing candidate resumes with job descriptions.'
        }
      ],
      certifications: [
        { id: 'cert-1', name: 'AWS Certified Solutions Architect – Associate', issuer: 'Amazon Web Services', year: '2023' },
        { id: 'cert-2', name: 'Certified Kubernetes Administrator (CKA)', issuer: 'Cloud Native Computing Foundation', year: '2022' }
      ]
    };

    // Deep copy helper for resetting
    const defaultData = JSON.parse(JSON.stringify(state));

    // INIT
    window.addEventListener('DOMContentLoaded', () => {
      // Check local storage for existing session
      const saved = localStorage.getItem('craft_resume_state');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          Object.assign(state, parsed);
        } catch(e) {
          console.error("Could not load local session", e);
        }
      }

      syncInputsFromState();
      renderAllFormLists();
      renderResume();
      lucide.createIcons();
    });

    // Save State to LocalStorage
    function persistState() {
      try {
        localStorage.setItem('craft_resume_state', JSON.stringify(state));
      } catch (e) {}
    }

    // Synchronize Input Fields with State
    function syncInputsFromState() {
      document.getElementById('f-fullName').value = state.personal.fullName || '';
      document.getElementById('f-jobTitle').value = state.personal.jobTitle || '';
      document.getElementById('f-email').value = state.personal.email || '';
      document.getElementById('f-phone').value = state.personal.phone || '';
      document.getElementById('f-location').value = state.personal.location || '';
      document.getElementById('f-website').value = state.personal.website || '';
      document.getElementById('f-linkedin').value = state.personal.linkedin || '';
      document.getElementById('f-github').value = state.personal.github || '';
      document.getElementById('f-summary').value = state.personal.summary || '';

      document.getElementById('cfg-template').value = state.config.template;
      document.getElementById('cfg-font').value = state.config.font;
      document.getElementById('cfg-density').value = state.config.density;

      // Update palette swatches active ring
      document.querySelectorAll('.palette-swatch').forEach(sw => {
        if (sw.dataset.color === state.config.accent) {
          sw.classList.add('ring-2', 'ring-offset-2', 'ring-indigo-500');
        } else {
          sw.classList.remove('ring-2', 'ring-offset-2', 'ring-indigo-500');
        }
      });
    }

    // Update config properties
    function updateConfig(key, value) {
      state.config[key] = value;
      persistState();
      if (key === 'accent') {
        document.querySelectorAll('.palette-swatch').forEach(sw => {
          if (sw.dataset.color === value) {
            sw.classList.add('ring-2', 'ring-offset-2', 'ring-indigo-500');
          } else {
            sw.classList.remove('ring-2', 'ring-offset-2', 'ring-indigo-500');
          }
        });
      }
      renderResume();
    }

    // Update top-level or nested personal field
    function updateField(path, value) {
      const parts = path.split('.');
      if (parts.length === 2) {
        state[parts[0]][parts[1]] = value;
      } else {
        state[path] = value;
      }
      persistState();
      renderResume();
    }

    // Toggle Accordion sections
    function toggleSection(id) {
      const el = document.getElementById(id);
      const icon = document.getElementById(id + '-icon');
      if (el.classList.contains('hidden')) {
        el.classList.remove('hidden');
        if (icon) icon.classList.remove('-rotate-90');
      } else {
        el.classList.add('hidden');
        if (icon) icon.classList.add('-rotate-90');
      }
    }

    // Mobile View Switcher
    function switchMobileView(view) {
      const editorPane = document.getElementById('editor-pane');
      const previewPane = document.getElementById('preview-pane');
      const tabEditor = document.getElementById('tab-editor');
      const tabPreview = document.getElementById('tab-preview');

      if (view === 'editor') {
        editorPane.classList.remove('hidden');
        previewPane.classList.add('hidden');
        tabEditor.className = "flex-1 py-1.5 rounded-md text-slate-900 bg-white shadow-sm font-semibold flex items-center justify-center space-x-1.5";
        tabPreview.className = "flex-1 py-1.5 rounded-md text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-1.5";
      } else {
        editorPane.classList.add('hidden');
        previewPane.classList.remove('hidden');
        tabPreview.className = "flex-1 py-1.5 rounded-md text-slate-900 bg-white shadow-sm font-semibold flex items-center justify-center space-x-1.5";
        tabEditor.className = "flex-1 py-1.5 rounded-md text-slate-600 hover:text-slate-900 flex items-center justify-center space-x-1.5";
      }
    }

    // -------------------------------------------------------------
    // DYNAMIC CRUD LIST BUILDERS (Experience, Education, Skills, etc.)
    // -------------------------------------------------------------

    function renderAllFormLists() {
      renderExperienceForm();
      renderEducationForm();
      renderSkillsForm();
      renderProjectsForm();
      renderCertificationsForm();
    }

    // 1. Work Experience Form List
    function renderExperienceForm() {
      const list = document.getElementById('experience-items-list');
      list.innerHTML = '';
      state.experience.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = "p-3 bg-slate-50 rounded-lg border border-slate-200/80 space-y-2 text-xs relative";
        div.innerHTML = `
          <div class="flex items-center justify-between pb-1 border-b border-slate-200/60">
            <span class="font-semibold text-slate-700">#${index + 1} ${item.role || 'Position'}</span>
            <button onclick="removeExperience('${item.id}')" class="text-rose-500 hover:text-rose-700 p-1" title="Delete">
              <i data-lucide="trash" class="w-3.5 h-3.5"></i>
            </button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" value="${escapeHtml(item.role)}" oninput="updateExp('${item.id}', 'role', this.value)" placeholder="Job Title" class="px-2 py-1 rounded border border-slate-200 text-xs">
            <input type="text" value="${escapeHtml(item.company)}" oninput="updateExp('${item.id}', 'company', this.value)" placeholder="Company" class="px-2 py-1 rounded border border-slate-200 text-xs">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" value="${escapeHtml(item.location)}" oninput="updateExp('${item.id}', 'location', this.value)" placeholder="Location (City, ST / Remote)" class="px-2 py-1 rounded border border-slate-200 text-xs">
            <input type="text" value="${escapeHtml(item.period)}" oninput="updateExp('${item.id}', 'period', this.value)" placeholder="Dates (e.g. 2021 - Present)" class="px-2 py-1 rounded border border-slate-200 text-xs">
          </div>
          <div>
            <label class="block text-[10px] text-slate-500 mb-0.5">Key Achievements / Bullets (One per line):</label>
            <textarea rows="3" oninput="updateExpBullets('${item.id}', this.value)" class="w-full px-2 py-1 rounded border border-slate-200 text-xs leading-relaxed" placeholder="• Led development of...&#10;• Reduced latency by...">${escapeHtml(item.bullets.join('\n'))}</textarea>
          </div>
        `;
        list.appendChild(div);
      });
      lucide.createIcons();
    }

    function addExperience() {
      const newId = 'exp-' + Date.now();
      state.experience.push({
        id: newId,
        role: '',
        company: '',
        location: '',
        period: '',
        bullets: ['Led cross-functional initiatives to improve operational efficiency.']
      });
      persistState();
      renderExperienceForm();
      renderResume();
    }

    function updateExp(id, key, value) {
      const exp = state.experience.find(e => e.id === id);
      if (exp) {
        exp[key] = value;
        persistState();
        renderResume();
      }
    }

    function updateExpBullets(id, text) {
      const exp = state.experience.find(e => e.id === id);
      if (exp) {
        exp.bullets = text.split('\n').filter(b => b.trim().length > 0);
        persistState();
        renderResume();
      }
    }

    function removeExperience(id) {
      state.experience = state.experience.filter(e => e.id !== id);
      persistState();
      renderExperienceForm();
      renderResume();
    }

    // 2. Education Form List
    function renderEducationForm() {
      const list = document.getElementById('education-items-list');
      list.innerHTML = '';
      state.education.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = "p-3 bg-slate-50 rounded-lg border border-slate-200/80 space-y-2 text-xs";
        div.innerHTML = `
          <div class="flex items-center justify-between pb-1 border-b border-slate-200/60">
            <span class="font-semibold text-slate-700">#${index + 1} ${item.degree || 'Degree'}</span>
            <button onclick="removeEducation('${item.id}')" class="text-rose-500 hover:text-rose-700 p-1" title="Delete">
              <i data-lucide="trash" class="w-3.5 h-3.5"></i>
            </button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" value="${escapeHtml(item.degree)}" oninput="updateEdu('${item.id}', 'degree', this.value)" placeholder="Degree / Major" class="px-2 py-1 rounded border border-slate-200 text-xs">
            <input type="text" value="${escapeHtml(item.school)}" oninput="updateEdu('${item.id}', 'school', this.value)" placeholder="University / College" class="px-2 py-1 rounded border border-slate-200 text-xs">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" value="${escapeHtml(item.location)}" oninput="updateEdu('${item.id}', 'location', this.value)" placeholder="Location" class="px-2 py-1 rounded border border-slate-200 text-xs">
            <input type="text" value="${escapeHtml(item.year)}" oninput="updateEdu('${item.id}', 'year', this.value)" placeholder="Graduation Year / Range" class="px-2 py-1 rounded border border-slate-200 text-xs">
          </div>
          <input type="text" value="${escapeHtml(item.details || '')}" oninput="updateEdu('${item.id}', 'details', this.value)" placeholder="Honors, GPA, Relevant Coursework" class="w-full px-2 py-1 rounded border border-slate-200 text-xs">
        `;
        list.appendChild(div);
      });
      lucide.createIcons();
    }

    function addEducation() {
      state.education.push({
        id: 'edu-' + Date.now(),
        degree: '',
        school: '',
        location: '',
        year: '',
        details: ''
      });
      persistState();
      renderEducationForm();
      renderResume();
    }

    function updateEdu(id, key, value) {
      const edu = state.education.find(e => e.id === id);
      if (edu) {
        edu[key] = value;
        persistState();
        renderResume();
      }
    }

    function removeEducation(id) {
      state.education = state.education.filter(e => e.id !== id);
      persistState();
      renderEducationForm();
      renderResume();
    }

    // 3. Skills Groups Form List
    function renderSkillsForm() {
      const list = document.getElementById('skills-groups-list');
      list.innerHTML = '';
      state.skills.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = "p-2.5 bg-slate-50 rounded-lg border border-slate-200/80 space-y-1.5 text-xs";
        div.innerHTML = `
          <div class="flex items-center justify-between">
            <input type="text" value="${escapeHtml(item.category)}" oninput="updateSkillGroup('${item.id}', 'category', this.value)" placeholder="Category (e.g. Languages)" class="font-semibold px-2 py-1 rounded border border-slate-200 w-2/3">
            <button onclick="removeSkillGroup('${item.id}')" class="text-rose-500 hover:text-rose-700 p-1" title="Delete">
              <i data-lucide="trash" class="w-3.5 h-3.5"></i>
            </button>
          </div>
          <input type="text" value="${escapeHtml(item.items)}" oninput="updateSkillGroup('${item.id}', 'items', this.value)" placeholder="Items separated by commas (e.g. Python, Docker, Go)" class="w-full px-2 py-1 rounded border border-slate-200">
        `;
        list.appendChild(div);
      });
      lucide.createIcons();
    }

    function addSkillGroup() {
      state.skills.push({
        id: 'sk-' + Date.now(),
        category: 'Specialization',
        items: 'Item 1, Item 2, Item 3'
      });
      persistState();
      renderSkillsForm();
      renderResume();
    }

    function updateSkillGroup(id, key, value) {
      const sk = state.skills.find(s => s.id === id);
      if (sk) {
        sk[key] = value;
        persistState();
        renderResume();
      }
    }

    function removeSkillGroup(id) {
      state.skills = state.skills.filter(s => s.id !== id);
      persistState();
      renderSkillsForm();
      renderResume();
    }

    // 4. Projects Form List
    function renderProjectsForm() {
      const list = document.getElementById('projects-items-list');
      list.innerHTML = '';
      state.projects.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = "p-3 bg-slate-50 rounded-lg border border-slate-200/80 space-y-2 text-xs";
        div.innerHTML = `
          <div class="flex items-center justify-between pb-1 border-b border-slate-200/60">
            <span class="font-semibold text-slate-700">#${index + 1} ${item.title || 'Project'}</span>
            <button onclick="removeProject('${item.id}')" class="text-rose-500 hover:text-rose-700 p-1" title="Delete">
              <i data-lucide="trash" class="w-3.5 h-3.5"></i>
            </button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" value="${escapeHtml(item.title)}" oninput="updateProject('${item.id}', 'title', this.value)" placeholder="Project Title" class="px-2 py-1 rounded border border-slate-200 text-xs">
            <input type="text" value="${escapeHtml(item.tech)}" oninput="updateProject('${item.id}', 'tech', this.value)" placeholder="Tech Stack (e.g. React, Node)" class="px-2 py-1 rounded border border-slate-200 text-xs">
          </div>
          <input type="text" value="${escapeHtml(item.link || '')}" oninput="updateProject('${item.id}', 'link', this.value)" placeholder="Project Link or Repo" class="w-full px-2 py-1 rounded border border-slate-200 text-xs">
          <textarea rows="2" oninput="updateProject('${item.id}', 'description', this.value)" placeholder="Impact / Description of project..." class="w-full px-2 py-1 rounded border border-slate-200 text-xs leading-relaxed">${escapeHtml(item.description)}</textarea>
        `;
        list.appendChild(div);
      });
      lucide.createIcons();
    }

    function addProject() {
      state.projects.push({
        id: 'prj-' + Date.now(),
        title: '',
        tech: '',
        link: '',
        description: ''
      });
      persistState();
      renderProjectsForm();
      renderResume();
    }

    function updateProject(id, key, value) {
      const prj = state.projects.find(p => p.id === id);
      if (prj) {
        prj[key] = value;
        persistState();
        renderResume();
      }
    }

    function removeProject(id) {
      state.projects = state.projects.filter(p => p.id !== id);
      persistState();
      renderProjectsForm();
      renderResume();
    }

    // 5. Certifications Form List
    function renderCertificationsForm() {
      const list = document.getElementById('certs-items-list');
      list.innerHTML = '';
      state.certifications.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = "p-2.5 bg-slate-50 rounded-lg border border-slate-200/80 space-y-1.5 text-xs";
        div.innerHTML = `
          <div class="flex items-center justify-between">
            <input type="text" value="${escapeHtml(item.name)}" oninput="updateCert('${item.id}', 'name', this.value)" placeholder="Certification Name" class="font-medium px-2 py-1 rounded border border-slate-200 w-2/3">
            <button onclick="removeCert('${item.id}')" class="text-rose-500 hover:text-rose-700 p-1" title="Delete">
              <i data-lucide="trash" class="w-3.5 h-3.5"></i>
            </button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" value="${escapeHtml(item.issuer)}" oninput="updateCert('${item.id}', 'issuer', this.value)" placeholder="Issuing Organization" class="px-2 py-1 rounded border border-slate-200 text-xs">
            <input type="text" value="${escapeHtml(item.year)}" oninput="updateCert('${item.id}', 'year', this.value)" placeholder="Year / Valid Until" class="px-2 py-1 rounded border border-slate-200 text-xs">
          </div>
        `;
        list.appendChild(div);
      });
      lucide.createIcons();
    }

    function addCertification() {
      state.certifications.push({
        id: 'cert-' + Date.now(),
        name: '',
        issuer: '',
        year: ''
      });
      persistState();
      renderCertificationsForm();
      renderResume();
    }

    function updateCert(id, key, value) {
      const c = state.certifications.find(item => item.id === id);
      if (c) {
        c[key] = value;
        persistState();
        renderResume();
      }
    }

    function removeCert(id) {
      state.certifications = state.certifications.filter(item => item.id !== id);
      persistState();
      renderCertificationsForm();
      renderResume();
    }

    // -------------------------------------------------------------
    // TEMPLATE RENDER ENGINE
    // -------------------------------------------------------------

    function renderResume() {
      const container = document.getElementById('resume-sheet');
      const { template, font, accent, density } = state.config;
      
      // Update font family class on sheet
      container.className = `a4-sheet p-8 sm:p-11 rounded-sm text-slate-800 ${font} ${density} transition-all duration-150`;

      // Density styles
      let gapMain = 'space-y-4';
      let gapItem = 'space-y-2';
      let textBase = 'text-[13px] leading-relaxed';
      let titleSize = 'text-2xl';
      if (density === 'density-compact') {
        gapMain = 'space-y-2.5';
        gapItem = 'space-y-1';
        textBase = 'text-[11.5px] leading-normal';
        titleSize = 'text-xl';
      } else if (density === 'density-spacious') {
        gapMain = 'space-y-6';
        gapItem = 'space-y-3';
        textBase = 'text-[14px] leading-relaxed';
        titleSize = 'text-3xl';
      }

      // Render based on chosen template
      if (template === 'executive') {
        container.innerHTML = renderExecutiveTemplate(accent, gapMain, gapItem, textBase, titleSize);
      } else if (template === 'compact') {
        container.innerHTML = renderCompactTemplate(accent, gapMain, gapItem, textBase, titleSize);
      } else if (template === 'creative') {
        container.innerHTML = renderCreativeTemplate(accent, gapMain, gapItem, textBase, titleSize);
      } else {
        container.innerHTML = renderModernTemplate(accent, gapMain, gapItem, textBase, titleSize);
      }
    }

    // 1. TEMPLATE: MODERN MINIMAL (Clean, professional, top-tier tech/corporate ATS standard)
    function renderModernTemplate(accent, gapMain, gapItem, textBase, titleSize) {
      const { personal, experience, education, skills, projects, certifications } = state;

      return `
        <div class="${gapMain}">
          <!-- Header -->
          <div class="border-b-2 pb-4" style="border-color: ${accent};">
            <h1 class="${titleSize} font-bold text-slate-900 tracking-tight">${escapeHtml(personal.fullName)}</h1>
            <div class="text-sm font-semibold tracking-wide uppercase mt-0.5" style="color: ${accent};">${escapeHtml(personal.jobTitle)}</div>
            
            <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-600 mt-2.5">
              ${personal.email ? `<span>${escapeHtml(personal.email)}</span>` : ''}
              ${personal.phone ? `<span>•</span><span>${escapeHtml(personal.phone)}</span>` : ''}
              ${personal.location ? `<span>•</span><span>${escapeHtml(personal.location)}</span>` : ''}
              ${personal.website ? `<span>•</span><span class="font-medium">${escapeHtml(personal.website)}</span>` : ''}
              ${personal.linkedin ? `<span>•</span><span>${escapeHtml(personal.linkedin)}</span>` : ''}
              ${personal.github ? `<span>•</span><span>${escapeHtml(personal.github)}</span>` : ''}
            </div>
          </div>

          <!-- Professional Summary -->
          ${personal.summary ? `
            <div>
              <h2 class="text-xs font-bold uppercase tracking-wider text-slate-700 pb-1 mb-1.5 border-b border-slate-200">Professional Summary</h2>
              <p class="${textBase} text-slate-700 text-justify">${escapeHtml(personal.summary)}</p>
            </div>
          ` : ''}

          <!-- Work Experience -->
          ${experience.length > 0 ? `
            <div>
              <h2 class="text-xs font-bold uppercase tracking-wider text-slate-700 pb-1 mb-2 border-b border-slate-200">Work Experience</h2>
              <div class="${gapItem}">
                ${experience.map(exp => `
                  <div>
                    <div class="flex justify-between items-baseline">
                      <span class="text-xs font-bold text-slate-900">${escapeHtml(exp.role)}</span>
                      <span class="text-xs text-slate-500 font-medium">${escapeHtml(exp.period)}</span>
                    </div>
                    <div class="flex justify-between items-baseline text-xs text-slate-600 italic mb-1">
                      <span class="font-semibold text-slate-700">${escapeHtml(exp.company)}</span>
                      <span>${escapeHtml(exp.location)}</span>
                    </div>
                    <ul class="list-disc list-outside ml-4 ${textBase} text-slate-700 space-y-0.5">
                      ${exp.bullets.map(b => `<li>${escapeHtml(b)}</li>`).join('')}
                    </ul>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <!-- Projects -->

    // -------------------------------------------------------------
    // BACKUP, RESTORE & DATA HELPERS
    // -------------------------------------------------------------

    // Export JSON Backup
    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
      const downloadAnchor = document.createElement('a');
      const filename = `resume_${(state.personal.fullName || 'craft').replace(/[^a-z0-9]/gi, '_').toLowerCase()}.json`;
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", filename);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast("Resume data exported to JSON!");
    }

    // Import JSON File
    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.personal && imported.experience) {
            Object.assign(state, imported);
            persistState();
            syncInputsFromState();
            renderAllFormLists();
            renderResume();
            showToast("Resume loaded from JSON successfully!");
          } else {
            showToast("Invalid JSON resume structure.");
          }
        } catch (err) {
          showToast("Error reading JSON file.");
        }
      };
      reader.readAsText(file);
      event.target.value = ''; // Reset input
    }

    // Load Sample Data Preset
    function loadSampleData() {
      Object.assign(state, JSON.parse(JSON.stringify(defaultData)));
      persistState();
      syncInputsFromState();
      renderAllFormLists();
      renderResume();
      showToast("Sample resume loaded!");
    }

    // Clear All Fields
    function clearAllData() {
      state.personal = {
        fullName: 'Your Name',
        jobTitle: 'Your Target Role',
        email: '',
        phone: '',
        location: '',
        website: '',
        linkedin: '',
        github: '',
        summary: ''
      };
      state.experience = [];
      state.education = [];
      state.skills = [];
      state.projects = [];
      state.certifications = [];

      persistState();
      syncInputsFromState();
      renderAllFormLists();
      renderResume();
      showToast("Editor cleared!");
    }

    // Toast Notification helper
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2600);
    }

    // Escape HTML strings for safe rendering
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
